[project]
name = "vitalis-conferencia-guias"
version = "0.1.0"
description = "Conferência de guias de convênio da Clínica Vitalis antes do envio (prova técnica Expert Integrado)"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.40,<2",
  "pandas>=2.0",
  "anthropic>=0.40",
  "mcp>=1.2",
]

[tool.setuptools]
py-modules = ["motor", "normalizador", "observacao", "servico", "verificar_lote", "gerar_relatorio"]
